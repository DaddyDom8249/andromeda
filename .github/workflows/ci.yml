name: Andromeda CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # The script-only suite relies on .grok/ sandbox assets absent from GitHub.
      # Run every portable source-level regression here; keep Grok-specific
      # script tests in npm test for their native environment.
      - name: Portable source and gameplay regressions
        run: npm run test:source
      - name: TypeScript checks
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build (without a database connection)
        run: npm run build
