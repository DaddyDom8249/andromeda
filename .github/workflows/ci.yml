name: Andromeda CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # The script-only suite relies on .grok/ sandbox assets absent from GitHub.
      # Run every portable source-level regression here; keep Grok-specific
      # script tests in npm test for their native environment.
      - name: Portable source and gameplay regressions
        run: npm run test:source
      - name: TypeScript checks
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build (without a database connection)
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          npm run dev > /tmp/andromeda-dev.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/andromeda-dev.log
          exit 1
      - name: Gameplay browser smoke (desktop and phone)
        run: node scripts/gameplay-browser-smoke.mjs
      - name: World crystal mesh pointer and touch regression
        run: node --experimental-strip-types scripts/game-crystal-pointer-smoke.mjs

